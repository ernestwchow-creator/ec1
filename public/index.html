<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover lets the page paint under the notch/home indicator;
       safe-area insets in the CSS keep content clear of them. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Chord Transposer</title>

  <!-- Installable to the iPhone/iPad home screen -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chords">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      /* Stop iOS from re-flowing text when the device rotates. */
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f0f5;
      color: #1a1a2e;
      min-height: 100vh;
      /* Kill the grey flash when tapping controls on iOS. */
      -webkit-tap-highlight-color: transparent;
      /* No rubber-band bounce past the page edges in standalone mode. */
      overscroll-behavior-y: none;
      padding-bottom: env(safe-area-inset-bottom);
    }

    header {
      background: #1a1a2e;
      color: #fff;
      /* Extend into the status bar area, then inset the content below it. */
      padding: calc(1rem + env(safe-area-inset-top)) calc(1.25rem + env(safe-area-inset-right))
               1rem calc(1.25rem + env(safe-area-inset-left));
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    header h1 { font-size: 1.2rem; font-weight: 600; }

    .auth-btn {
      background: #6c5ce7;
      color: #fff;
      border: none;
      /* 44px tall: Apple's minimum comfortable tap target. */
      min-height: 44px;
      padding: 0.5rem 1.2rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
    }
    .auth-btn:active { background: #5a4bd1; }
    .auth-btn.logout { background: transparent; border: 1px solid #555; }

    main {
      max-width: 960px;
      margin: 1.5rem auto;
      padding: 0 calc(1rem + env(safe-area-inset-left)) 2rem calc(1rem + env(safe-area-inset-right));
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card h2 {
      font-size: 1.1rem;
      margin-bottom: 1rem;
      color: #333;
    }

    .url-row {
      display: flex;
      gap: 0.5rem;
    }

    .url-row input {
      flex: 1;
      min-width: 0;
      min-height: 48px;
      padding: 0.7rem 1rem;
      border: 2px solid #ddd;
      border-radius: 8px;
      /* Must be >=16px or iOS Safari zooms the page in on focus. */
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
      -webkit-appearance: none;
      appearance: none;
    }
    .url-row input:focus { border-color: #6c5ce7; }

    .btn {
      background: #6c5ce7;
      color: #fff;
      border: none;
      min-height: 48px;
      padding: 0.7rem 1.5rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 500;
      transition: background 0.15s;
      -webkit-appearance: none;
      appearance: none;
      touch-action: manipulation;
    }
    .btn:active { background: #5a4bd1; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }
    .btn.success { background: #00b894; }
    .btn.success:active { background: #00a381; }
    .btn.full { width: 100%; }

    .doc-title {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #1a1a2e;
    }

    .chart-selector {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .chart-tab {
      min-height: 44px;
      padding: 0.4rem 1rem;
      border: 2px solid #ddd;
      border-radius: 22px;
      background: #fff;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.15s;
      touch-action: manipulation;
      -webkit-appearance: none;
      appearance: none;
    }
    .chart-tab.active {
      border-color: #6c5ce7;
      background: #f0edff;
      color: #6c5ce7;
      font-weight: 600;
    }

    .chart-table-wrapper {
      overflow-x: auto;
      margin-bottom: 1rem;
      /* Momentum scrolling on iOS, and don't let a horizontal swipe on the
         table trigger Safari's back-navigation gesture. */
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
      border-radius: 8px;
    }

    .chord-table {
      border-collapse: separate;
      border-spacing: 0;
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      font-size: 0.85rem;
      width: 100%;
    }

    .chord-table td {
      border-right: 1px solid #e0e0e0;
      border-bottom: 1px solid #e0e0e0;
      padding: 0.55rem 0.7rem;
      text-align: center;
      white-space: nowrap;
      background: #fff;
    }
    .chord-table tr:first-child td { border-top: 1px solid #e0e0e0; }
    .chord-table td:first-child { border-left: 1px solid #e0e0e0; }

    /* Pin the section label so it stays visible while chords scroll sideways. */
    .chord-table td:first-child {
      background: #f8f8fc;
      font-weight: 600;
      color: #555;
      text-align: left;
      position: sticky;
      left: 0;
      z-index: 1;
      box-shadow: 1px 0 0 #e0e0e0;
    }

    .transpose-controls {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    .semitone-group {
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .semitone-btn {
      width: 48px;
      height: 48px;
      border: 2px solid #ddd;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      font-size: 1.5rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      color: #333;
      -webkit-appearance: none;
      appearance: none;
      /* Skip the 300ms tap delay and block double-tap-to-zoom on the steppers. */
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }
    .semitone-btn:active { border-color: #6c5ce7; color: #6c5ce7; background: #f0edff; }

    .semitone-display {
      font-size: 1.25rem;
      font-weight: 700;
      min-width: 3rem;
      text-align: center;
      color: #6c5ce7;
      font-variant-numeric: tabular-nums;
    }

    .key-display {
      font-size: 0.95rem;
      color: #555;
    }
    .key-display strong { color: #6c5ce7; }

    .flat-toggle {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.95rem;
      color: #555;
      min-height: 44px;
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
    }

    .flat-toggle input[type="checkbox"] {
      width: 24px;
      height: 24px;
      accent-color: #6c5ce7;
      flex-shrink: 0;
    }

    .section-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #888;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    .transposed-section { margin-top: 1rem; }

    .chord-table.transposed td { color: #6c5ce7; }
    .chord-table.transposed td:first-child { color: #555; }

    .message {
      padding: 0.8rem 1rem;
      border-radius: 8px;
      margin-top: 1rem;
      font-size: 0.9rem;
    }
    .message.error { background: #ffe0e0; color: #c0392b; }
    .message.success { background: #e0ffe8; color: #27ae60; }

    .loading { opacity: 0.6; pointer-events: none; }

    .login-prompt {
      text-align: center;
      padding: 3rem 1rem;
    }
    .login-prompt p {
      margin-bottom: 1.5rem;
      color: #666;
      font-size: 1rem;
    }

    .hidden { display: none !important; }

    .setup-info {
      font-size: 0.85rem;
      color: #888;
      margin-top: 1rem;
      line-height: 1.6;
    }
    .setup-info code {
      background: #f0f0f5;
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      font-size: 0.8rem;
    }

    /* iPhone */
    @media (max-width: 700px) {
      header {
        padding: calc(0.75rem + env(safe-area-inset-top)) 1rem 0.75rem 1rem;
      }
      header h1 { font-size: 1.05rem; }
      main { margin: 1rem auto; }
      .card { padding: 1rem; border-radius: 10px; }
      .url-row { flex-direction: column; }
      .chord-table { font-size: 0.8rem; }
      .chord-table td { padding: 0.5rem 0.55rem; }

      .transpose-controls {
        flex-direction: column;
        align-items: stretch;
        gap: 0.85rem;
        padding: 0.9rem;
        background: #fafafe;
        border-radius: 10px;
      }
      /* Center the stepper and let it breathe on a narrow screen. */
      .semitone-group { justify-content: center; gap: 0.75rem; }
      .semitone-btn { width: 52px; height: 52px; }
      .key-display { text-align: center; }
      .flat-toggle { justify-content: center; }

      /* A full-width button is easier to hit with a thumb. */
      #add-btn { width: 100%; }
    }

    /* iPad and larger: show original and transposed side by side so you can
       compare them without scrolling. */
    @media (min-width: 900px) {
      main { max-width: 1100px; }

      .compare.has-transposed {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.25rem;
        align-items: start;
      }
      /* Grid children default to min-width:auto, so a wide chord table would
         push the column past the viewport. Let them shrink and scroll the
         table inside its own wrapper instead. */
      .compare.has-transposed > * { min-width: 0; }
      .transposed-section { margin-top: 0; }
    }

    /* Landscape iPad / desktop can go wider still. */
    @media (min-width: 1200px) {
      main { max-width: 1240px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Chord Transposer</h1>
    <div id="auth-area"></div>
  </header>

  <main>
    <div id="login-section" class="card login-prompt hidden">
      <p>Sign in with your Google account to read and edit chord charts in Google Docs.</p>
      <a href="/auth" class="auth-btn">Sign in with Google</a>
    </div>

    <div id="app-section" class="hidden">
      <div class="card">
        <h2>Load a chord chart</h2>
        <div class="url-row">
          <input type="text" id="doc-url" placeholder="Paste a Google Doc URL..." />
          <button class="btn" id="load-btn" onclick="loadDocument()">Load</button>
        </div>
        <div id="load-error"></div>
      </div>

      <div id="chart-area" class="hidden">
        <div class="card">
          <div class="doc-title" id="doc-title"></div>

          <div id="multi-chart-selector" class="chart-selector hidden"></div>

          <div class="transpose-controls">
            <div class="semitone-group">
              <button class="semitone-btn" onclick="changeSemitones(-1)" aria-label="Transpose down a semitone">&minus;</button>
              <span class="semitone-display" id="semitone-display">0</span>
              <button class="semitone-btn" onclick="changeSemitones(1)" aria-label="Transpose up a semitone">+</button>
            </div>
            <div class="key-display" id="key-display"></div>
            <label class="flat-toggle">
              <input type="checkbox" id="use-flats" onchange="updatePreview()" />
              Use flats
            </label>
          </div>

          <div class="compare" id="compare">
            <div>
              <div class="section-label">Original</div>
              <div class="chart-table-wrapper" id="original-chart"></div>
            </div>

            <div id="transposed-section" class="transposed-section hidden">
              <div class="section-label">Transposed</div>
              <div class="chart-table-wrapper" id="transposed-chart"></div>
            </div>
          </div>

          <div id="add-section" class="hidden">
            <button class="btn success full" id="add-btn" onclick="addToDocument()">
              Add transposed chart to document
            </button>
          </div>

          <div id="result-message"></div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const NOTES_SHARP = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
    const NOTES_FLAT = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
    const FLAT_KEYS = new Set(['F','Bb','Eb','Ab','Db','Gb']);

    function noteToIndex(note) {
      const n = note.replace('♯','#').replace('♭','b');
      let i = NOTES_SHARP.indexOf(n);
      if (i === -1) i = NOTES_FLAT.indexOf(n);
      return i;
    }

    function transposeNote(note, semi, useFlats) {
      const idx = noteToIndex(note);
      if (idx === -1) return note;
      const ni = ((idx + semi) % 12 + 12) % 12;
      return useFlats ? NOTES_FLAT[ni] : NOTES_SHARP[ni];
    }

    function transposeToken(token, semi, useFlats) {
      const m = token.match(/^([^A-G]*)([A-G])([#b♯♭]?)(.*)/);
      if (!m) return token;
      const [, prefix, letter, acc, rest] = m;
      const root = letter + acc;
      const tr = transposeNote(root, semi, useFlats);
      const bm = rest.match(/^(.*)\/([A-G])([#b♯♭]?)$/);
      if (bm) {
        const [, q, bl, ba] = bm;
        return prefix + tr + q + '/' + transposeNote(bl + ba, semi, useFlats);
      }
      return prefix + tr + rest;
    }

    function transposeCellText(text, semi, useFlats) {
      if (!text || !text.trim()) return text;
      return text.split(/(\s+)/).map(p =>
        /^\s*$/.test(p) ? p : transposeToken(p, semi, useFlats)
      ).join('');
    }

    let state = {
      doc: null,
      selectedChart: 0,
      semitones: 0,
      useFlats: false
    };

    async function checkAuth() {
      const res = await fetch('/api/me');
      const { authenticated } = await res.json();
      const authArea = document.getElementById('auth-area');
      if (authenticated) {
        authArea.innerHTML = '<a href="/auth/logout" class="auth-btn logout">Sign out</a>';
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('app-section').classList.remove('hidden');
      } else {
        authArea.innerHTML = '<a href="/auth" class="auth-btn">Sign in</a>';
        document.getElementById('login-section').classList.remove('hidden');
        document.getElementById('app-section').classList.add('hidden');
      }
    }

    async function loadDocument() {
      const url = document.getElementById('doc-url').value.trim();
      if (!url) return;

      const btn = document.getElementById('load-btn');
      const errDiv = document.getElementById('load-error');
      btn.disabled = true;
      btn.textContent = 'Loading...';
      errDiv.innerHTML = '';

      try {
        const res = await fetch('/api/document?url=' + encodeURIComponent(url));
        const data = await res.json();

        if (!res.ok) {
          errDiv.innerHTML = '<div class="message error">' + escapeHtml(data.error) + '</div>';
          return;
        }

        if (data.chordCharts.length === 0) {
          errDiv.innerHTML = '<div class="message error">No chord charts found in this document.</div>';
          return;
        }

        state.doc = data;
        state.selectedChart = 0;
        state.semitones = 0;
        document.getElementById('use-flats').checked = false;
        state.useFlats = false;

        displayDocument();
      } catch (e) {
        errDiv.innerHTML = '<div class="message error">Failed to load document. Check the URL and try again.</div>';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Load';
      }
    }

    function displayDocument() {
      document.getElementById('chart-area').classList.remove('hidden');
      document.getElementById('doc-title').textContent = state.doc.title;
      document.getElementById('result-message').innerHTML = '';

      const selector = document.getElementById('multi-chart-selector');
      if (state.doc.chordCharts.length > 1) {
        selector.classList.remove('hidden');
        selector.innerHTML = state.doc.chordCharts.map((chart, i) =>
          '<button class="chart-tab' + (i === state.selectedChart ? ' active' : '') +
          '" onclick="selectChart(' + i + ')">Chart ' + (i + 1) +
          ' (Key of ' + escapeHtml(chart.detectedKey) + ')</button>'
        ).join('');
      } else {
        selector.classList.add('hidden');
      }

      renderOriginal();
      updateKeyDisplay();
      updatePreview();
    }

    function selectChart(idx) {
      state.selectedChart = idx;
      state.semitones = 0;
      displayDocument();
    }

    function renderOriginal() {
      const chart = state.doc.chordCharts[state.selectedChart];
      document.getElementById('original-chart').innerHTML = renderTable(chart.data, false);
    }

    function renderTable(data, isTransposed) {
      let html = '<table class="chord-table' + (isTransposed ? ' transposed' : '') + '">';
      for (const row of data) {
        html += '<tr>';
        for (const cell of row) {
          html += '<td>' + escapeHtml(cell || '') + '</td>';
        }
        html += '</tr>';
      }
      html += '</table>';
      return html;
    }

    function changeSemitones(delta) {
      state.semitones = ((state.semitones + delta) % 12 + 12) % 12;
      if (state.semitones > 6) state.semitones -= 12;
      updatePreview();
      updateKeyDisplay();
    }

    function updateKeyDisplay() {
      const chart = state.doc.chordCharts[state.selectedChart];
      const origKey = chart.detectedKey;
      const useFlats = document.getElementById('use-flats').checked;
      const newKey = transposeNote(origKey, state.semitones, useFlats);

      document.getElementById('semitone-display').textContent =
        (state.semitones > 0 ? '+' : '') + state.semitones;

      const sign = state.semitones > 0 ? '+' : '';
      document.getElementById('key-display').innerHTML =
        'Key of <strong>' + escapeHtml(origKey) + '</strong> &rarr; <strong>' +
        escapeHtml(newKey) + '</strong> (' + sign + state.semitones + ' semitones)';
    }

    function updatePreview() {
      const useFlats = document.getElementById('use-flats').checked;
      state.useFlats = useFlats;

      const section = document.getElementById('transposed-section');
      const addSection = document.getElementById('add-section');
      const compare = document.getElementById('compare');
      if (state.semitones === 0) {
        section.classList.add('hidden');
        addSection.classList.add('hidden');
        compare.classList.remove('has-transposed');
        return;
      }
      section.classList.remove('hidden');
      addSection.classList.remove('hidden');
      compare.classList.add('has-transposed');

      const chart = state.doc.chordCharts[state.selectedChart];
      const transposed = chart.data.map((row) =>
        row.map((cell, c) => c === 0 ? cell : transposeCellText(cell, state.semitones, useFlats))
      );

      document.getElementById('transposed-chart').innerHTML = renderTable(transposed, true);
      updateKeyDisplay();
    }

    async function addToDocument() {
      if (state.semitones === 0) return;

      const btn = document.getElementById('add-btn');
      const msgDiv = document.getElementById('result-message');
      btn.disabled = true;
      btn.textContent = 'Adding...';
      msgDiv.innerHTML = '';

      try {
        const res = await fetch('/api/transpose', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            documentId: state.doc.documentId,
            chartIndex: state.selectedChart,
            semitones: state.semitones,
            useFlats: state.useFlats
          })
        });
        const data = await res.json();

        if (data.success) {
          const docUrl = 'https://docs.google.com/document/d/' + state.doc.documentId;
          msgDiv.innerHTML =
            '<div class="message success">Transposed chart added! ' +
            '<a href="' + docUrl + '" target="_blank">Open document</a></div>';
        } else {
          msgDiv.innerHTML = '<div class="message error">' + escapeHtml(data.error) + '</div>';
        }
      } catch (e) {
        msgDiv.innerHTML = '<div class="message error">Failed to add chart. Please try again.</div>';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Add transposed chart to document';
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    document.getElementById('doc-url').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        // Dismiss the iOS keyboard so the results aren't hidden behind it.
        e.target.blur();
        loadDocument();
      }
    });

    // On iOS the share sheet often hands over a URL with tracking params;
    // pasting is the normal path, so select-all on focus makes replacing easy.
    document.getElementById('doc-url').addEventListener('focus', (e) => {
      if (e.target.value) e.target.select();
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {
          // Offline shell is a nice-to-have; the app works fine without it.
        });
      });
    }

    checkAuth();
  </script>
</body>
</html>
