<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>學客話 Learn Hakka</title>
<style>
@font-face {
  font-family: 'SystemSerif';
  src: local('Georgia'), local('Times New Roman'), local('serif');
}

:root {
  --bg: #F5F0E8;
  --surface: #FDFBF7;
  --text: #2A2520;
  --text-secondary: #7A746C;
  --accent: #2B4C3F;
  --accent-warm: #C4785B;
  --accent-light: #E8EDE9;
  --border: #DDD7CD;
  --jade: #5B8C6F;
  --jade-bg: #EDF5F0;
  --error: #B5493A;
  --error-bg: #FAEDEB;
  --radius: 6px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1C1A17;
    --surface: #262320;
    --text: #E8E2D8;
    --text-secondary: #9A948C;
    --accent: #7DB892;
    --accent-warm: #D49272;
    --accent-light: #2A3230;
    --border: #3A3632;
    --jade: #7DB892;
    --jade-bg: #1E2E24;
    --error: #D4766A;
    --error-bg: #2E2220;
    --radius: 6px;
  }
}
:root[data-theme="dark"] {
  --bg: #1C1A17;
  --surface: #262320;
  --text: #E8E2D8;
  --text-secondary: #9A948C;
  --accent: #7DB892;
  --accent-warm: #D49272;
  --accent-light: #2A3230;
  --border: #3A3632;
  --jade: #7DB892;
  --jade-bg: #1E2E24;
  --error: #D4766A;
  --error-bg: #2E2220;
}
:root[data-theme="light"] {
  --bg: #F5F0E8;
  --surface: #FDFBF7;
  --text: #2A2520;
  --text-secondary: #7A746C;
  --accent: #2B4C3F;
  --accent-warm: #C4785B;
  --accent-light: #E8EDE9;
  --border: #DDD7CD;
  --jade: #5B8C6F;
  --jade-bg: #EDF5F0;
  --error: #B5493A;
  --error-bg: #FAEDEB;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

.app {
  max-width: 640px;
  margin: 0 auto;
  padding: 1.5rem 1rem 3rem;
}

.app-header {
  text-align: center;
  padding-bottom: 1.5rem;
  border-bottom: 1px solid var(--border);
  margin-bottom: 1.25rem;
}

.app-title {
  font-family: SystemSerif, Georgia, 'Times New Roman', serif;
  font-size: 1.75rem;
  font-weight: 400;
  color: var(--accent);
  letter-spacing: 0.02em;
  margin-bottom: 1rem;
}

.app-title span {
  display: block;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--text-secondary);
  margin-top: 0.25rem;
}

.settings {
  display: flex;
  gap: 1rem;
  justify-content: center;
  flex-wrap: wrap;
  align-items: center;
}

.setting-group {
  display: flex;
  align-items: center;
  gap: 0.4rem;
}

.setting-group label {
  font-size: 0.78rem;
  color: var(--text-secondary);
  letter-spacing: 0.02em;
}

.setting-group select {
  padding: 0.35rem 0.5rem;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--text);
  font-size: 0.85rem;
  font-family: inherit;
  cursor: pointer;
}

.tone-toggle {
  padding: 0.3rem 0.6rem;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 0.78rem;
  font-family: inherit;
  transition: all 0.15s;
}
.tone-toggle:first-of-type { border-radius: var(--radius) 0 0 var(--radius); }
.tone-toggle:last-of-type { border-radius: 0 var(--radius) var(--radius) 0; border-left: none; }
.tone-toggle.active {
  background: var(--accent);
  color: var(--bg);
  border-color: var(--accent);
}
.tone-toggle:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.mode-nav {
  display: flex;
  gap: 0;
  margin-bottom: 1.5rem;
  border-bottom: 1px solid var(--border);
}

.mode-btn {
  flex: 1;
  padding: 0.65rem 0.5rem;
  border: none;
  background: none;
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 0.82rem;
  font-family: inherit;
  transition: all 0.15s;
  border-bottom: 2px solid transparent;
  text-align: center;
}

.mode-btn:hover { color: var(--text); }
.mode-btn.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
  font-weight: 600;
}
.mode-btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: -2px;
}

.mode-label { display: block; font-size: 0.72rem; margin-top: 0.15rem; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0.9rem 1rem;
  margin-bottom: 0.6rem;
  transition: border-color 0.15s;
  display: flex;
  align-items: flex-start;
  gap: 0.6rem;
}
.card:hover { border-color: var(--accent); }
.card-text { flex: 1; }

.characters {
  font-family: SystemSerif, Georgia, 'Times New Roman', serif;
  font-size: 1.35rem;
  font-weight: 400;
  margin-bottom: 0.2rem;
  line-height: 1.4;
}

.romanization {
  font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
  font-size: 0.88rem;
  color: var(--accent);
  margin-bottom: 0.15rem;
  letter-spacing: 0.01em;
}

.english {
  font-size: 0.82rem;
  color: var(--text-secondary);
}

.play-btn {
  flex-shrink: 0;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--accent);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
  margin-top: 0.2rem;
  position: relative;
}
.play-btn:hover {
  border-color: var(--accent);
  background: var(--accent-light);
}
.play-btn:active { transform: scale(0.92); }
.play-btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.play-btn.playing {
  border-color: var(--accent);
  background: var(--accent);
  color: var(--bg);
}
.play-btn.loading {
  border-color: var(--accent);
  opacity: 0.7;
  cursor: wait;
}
.play-btn.error {
  border-color: var(--error);
  color: var(--error);
}
.play-btn svg { width: 16px; height: 16px; fill: currentColor; }

.play-inline {
  display: inline-flex;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--accent);
  cursor: pointer;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
  vertical-align: middle;
  margin-left: 0.4rem;
}
.play-inline:hover {
  border-color: var(--accent);
  background: var(--accent-light);
}
.play-inline:active { transform: scale(0.92); }
.play-inline.playing {
  border-color: var(--accent);
  background: var(--accent);
  color: var(--bg);
}
.play-inline.loading {
  border-color: var(--accent);
  opacity: 0.7;
  cursor: wait;
}
.play-inline.error {
  border-color: var(--error);
  color: var(--error);
}
.play-inline svg { width: 12px; height: 12px; fill: currentColor; }

@keyframes spin {
  to { transform: rotate(360deg); }
}
.play-btn.loading svg, .play-inline.loading svg {
  animation: spin 0.8s linear infinite;
}

.tts-status {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0.6rem 0.9rem;
  margin-bottom: 1rem;
  font-size: 0.78rem;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.tts-status .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.tts-status .dot.ok { background: var(--jade); }
.tts-status .dot.err { background: var(--error); }
.tts-status .dot.loading { background: var(--accent-warm); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.4; } }

.topic-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 0.6rem;
}

.topic-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.1rem 0.8rem;
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
}
.topic-card:hover {
  border-color: var(--accent);
  transform: translateY(-1px);
}
.topic-card:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.topic-chinese {
  font-family: SystemSerif, Georgia, 'Times New Roman', serif;
  font-size: 1.2rem;
  display: block;
  margin-bottom: 0.2rem;
}
.topic-english {
  font-size: 0.78rem;
  color: var(--text-secondary);
  letter-spacing: 0.02em;
}

.section-title {
  font-family: SystemSerif, Georgia, 'Times New Roman', serif;
  font-size: 1.1rem;
  font-weight: 400;
  margin-bottom: 1rem;
  color: var(--text);
}

.section-desc {
  font-size: 0.82rem;
  color: var(--text-secondary);
  margin-bottom: 1rem;
  line-height: 1.5;
}

.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  padding: 0.35rem 0.7rem;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 0.8rem;
  font-family: inherit;
  margin-bottom: 1rem;
  transition: border-color 0.15s;
}
.back-btn:hover { border-color: var(--accent); color: var(--text); }

.no-data {
  text-align: center;
  padding: 2rem;
  color: var(--text-secondary);
  font-style: italic;
  font-size: 0.88rem;
}

.dialogue-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 0.6rem;
}
.dialogue-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0.9rem;
  cursor: pointer;
  transition: all 0.15s;
}
.dialogue-card:hover {
  border-color: var(--accent);
  transform: translateY(-1px);
}
.dialogue-card .d-title {
  font-family: SystemSerif, Georgia, 'Times New Roman', serif;
  font-size: 1rem;
}
.dialogue-card .d-subtitle {
  font-size: 0.78rem;
  color: var(--text-secondary);
  margin-top: 0.15rem;
}

.progress-bar {
  display: flex;
  gap: 0.25rem;
  margin-bottom: 1rem;
}
.progress-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--border);
  transition: all 0.2s;
}
.progress-dot.done { background: var(--accent); }
.progress-dot.current {
  background: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-light);
}

.dialogue-line {
  display: flex;
  gap: 0.65rem;
  align-items: flex-start;
  margin-bottom: 0.75rem;
  padding: 0.7rem;
  border-radius: var(--radius);
}
.dialogue-line.speaker-A { background: var(--accent-light); }
.dialogue-line.speaker-B {
  background: var(--surface);
  border: 1px solid var(--border);
}
.speaker-label {
  font-weight: 600;
  font-size: 0.75rem;
  color: var(--accent);
  min-width: 1.3rem;
  letter-spacing: 0.03em;
}
.line-content { flex: 1; }

.scenario-prompt {
  background: var(--accent-light);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem;
  text-align: center;
  margin-bottom: 1.25rem;
}
.scenario-prompt .characters { font-size: 1.5rem; }

.choices { display: flex; flex-direction: column; gap: 0.5rem; }
.choice-btn {
  padding: 0.85rem 1rem;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  cursor: pointer;
  text-align: left;
  transition: all 0.15s;
  font-family: inherit;
  color: var(--text);
}
.choice-btn:hover:not(.chosen) { border-color: var(--accent); }
.choice-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.choice-btn.correct { border-color: var(--jade); background: var(--jade-bg); }
.choice-btn.incorrect { border-color: var(--error); background: var(--error-bg); }
.choice-btn .choice-chars {
  font-family: SystemSerif, Georgia, 'Times New Roman', serif;
  font-size: 1.1rem;
}
.choice-btn .choice-eng { font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.15rem; }
.choice-btn .choice-rom {
  font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
  font-size: 0.82rem;
  color: var(--jade);
  margin-top: 0.2rem;
}

.score {
  font-size: 0.82rem;
  color: var(--text-secondary);
  margin-bottom: 0.75rem;
  font-variant-numeric: tabular-nums;
}

.freeform-input {
  width: 100%;
  padding: 0.7rem;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--text);
  font-size: 1rem;
  font-family: inherit;
  margin-bottom: 0.75rem;
}
.freeform-input:focus { outline: none; border-color: var(--accent); }

.btn {
  padding: 0.5rem 1.2rem;
  background: var(--accent);
  color: var(--bg);
  border: none;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 0.85rem;
  font-family: inherit;
  transition: opacity 0.15s;
}
.btn:hover { opacity: 0.88; }
.btn:focus-visible { outline: 2px solid var(--accent-warm); outline-offset: 2px; }

.feedback {
  margin-top: 0.75rem;
  padding: 0.85rem;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--surface);
}
.feedback-msg { font-weight: 600; font-size: 0.88rem; }
.feedback-msg.ok { color: var(--jade); }
.feedback-msg.wrong { color: var(--error); }

.footer {
  text-align: center;
  padding: 1.25rem 0 0;
  margin-top: 2rem;
  border-top: 1px solid var(--border);
  font-size: 0.72rem;
  color: var(--text-secondary);
  letter-spacing: 0.02em;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; transform: none !important; animation: none !important; }
}
</style>

<div class="app">
  <header class="app-header">
    <h1 class="app-title">學客話<span>Learn Hakka</span></h1>
    <div class="settings">
      <div class="setting-group">
        <label>方言</label>
        <select id="dialect-select"></select>
      </div>
      <div class="setting-group">
        <label>聲調</label>
        <button class="tone-toggle active" data-tone="numeric">sa1</button>
        <button class="tone-toggle" data-tone="diacritic">sā</button>
      </div>
    </div>
  </header>

  <nav class="mode-nav">
    <button class="mode-btn active" data-mode="browse">📖<span class="mode-label">Browse</span></button>
    <button class="mode-btn" data-mode="dialogue">💬<span class="mode-label">Dialogue</span></button>
    <button class="mode-btn" data-mode="scenario">🎯<span class="mode-label">Scenarios</span></button>
    <button class="mode-btn" data-mode="freeform">✍️<span class="mode-label">Free Form</span></button>
  </nav>

  <main id="main"></main>

  <footer class="footer">
    Audio powered by gohakka.org TTS — open the file locally for audio playback
  </footer>
</div>

<script>

  { id:'g09', topic:'greetings', characters:'食飽未？', english:'Have you eaten? (common greeting)', dialects:{ sixian:{pfs:'siid8 bau3 mui5?',tones:'siid bàu mūi?'}, hailu:{pfs:'siid8 bau3 mui5?',tones:'siid bàu mūi?'} }},

let state = { dialect:'sixian', toneDisplay:'numeric', mode:'browse', topic:null, dialogueId:null, revealedLines:0, scenarioIdx:0, selected:null, score:0, completed:0 };

const audioCache = {};

function getTtsUrl(pfsText, dialect) {
  const code = DIALECTS[dialect].ttsCode;
  const clean = pfsText.replace(/[?!.,;：。，！？]/g, '').trim();
  return `https://tts-${code}.gohakka.org`;
}

async function fetchTtsAudio(pfsText, dialect) {
  const cacheKey = `${dialect}:${pfsText}`;
  if (audioCache[cacheKey]) return audioCache[cacheKey];

  const code = DIALECTS[dialect].ttsCode;
  const clean = pfsText.replace(/[?!.,;：。，！？]/g, '').trim();

  const isLocal = location.protocol === 'http:' || location.protocol === 'https:';
  const url = isLocal
    ? '/tts'
    : `https://tts-${code}.gohakka.org`;

  const body = isLocal
    ? `dialect=${encodeURIComponent(code)}&toivun=${encodeURIComponent(clean)}`
    : (() => { const fd = new FormData(); fd.append('toivun', clean); fd.append('socoi', 'output.wav'); return fd; })();

  const headers = isLocal ? {'Content-Type': 'application/x-www-form-urlencoded'} : {};

  const resp = await fetch(url, {
    method: 'POST',
    body,
    headers,
  });

  if (!resp.ok) throw new Error(`TTS returned ${resp.status}`);

  const blob = await resp.blob();
  const audioUrl = URL.createObjectURL(blob);
  audioCache[cacheKey] = audioUrl;
  return audioUrl;
}

async function playTts(pfsText, dialect, btn) {
  if (btn.classList.contains('playing') || btn.classList.contains('loading')) return;

  btn.classList.add('loading');
  btn.innerHTML = LOADING_SVG;

  try {
    const audioUrl = await fetchTtsAudio(pfsText, dialect);
    btn.classList.remove('loading');
    btn.classList.add('playing');
    btn.innerHTML = PLAY_SVG;

    const audio = new Audio(audioUrl);
    audio.addEventListener('ended', () => {
      btn.classList.remove('playing');
    });
    audio.addEventListener('error', () => {
      btn.classList.remove('playing');
      btn.classList.add('error');
      setTimeout(() => btn.classList.remove('error'), 2000);
    });
    await audio.play();
  } catch (e) {
    btn.classList.remove('loading');
    btn.classList.add('error');
    btn.innerHTML = PLAY_SVG;
    btn.title = 'Audio unavailable — open this file locally to enable TTS';
    setTimeout(() => btn.classList.remove('error'), 3000);
  }
}

const $=s=>document.querySelector(s);
const main=$('#main');

const sel=$('#dialect-select');
for(const[k,d]of Object.entries(DIALECTS)){
  const o=document.createElement('option');
  o.value=k; o.textContent=`${d.name} ${d.english}`;
  sel.appendChild(o);
}
sel.addEventListener('change',e=>{state.dialect=e.target.value;render();});

document.querySelectorAll('.tone-toggle').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tone-toggle').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.toneDisplay=btn.dataset.tone;
    render();
  });
});

document.querySelectorAll('.mode-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.mode=btn.dataset.mode;
    state.topic=null;state.dialogueId=null;state.selected=null;
    render();
  });
});

function rom(dialectData){ return state.toneDisplay==='numeric'?dialectData.pfs:dialectData.tones; }

function playBtn(pfs, cls) {
  cls = cls || 'play-btn';
  return `<button class="${cls}" data-pfs="${pfs.replace(/"/g,'&quot;')}" aria-label="Play audio">${PLAY_SVG}</button>`;
}

function bindPlayButtons() {
  document.querySelectorAll('.play-btn[data-pfs], .play-inline[data-pfs]').forEach(btn => {
    if (btn._bound) return;
    btn._bound = true;
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      playTts(btn.dataset.pfs, state.dialect, btn);
    });
  });
}

function ttsStatusHtml() {
  return `<div class="tts-status"><span class="dot ok"></span>Audio via gohakka.org — tap any speaker icon to hear real Hakka pronunciation</div>`;
}

function render(){
  switch(state.mode){
    case 'browse': renderBrowse(); break;
    case 'dialogue': renderDialogue(); break;
    case 'scenario': renderScenario(); break;
    case 'freeform': renderFreeform(); break;
  }
  bindPlayButtons();
}

function renderBrowse(){
  if(!state.topic){
    main.innerHTML=`<h2 class="section-title">Choose a topic</h2><div class="topic-grid">${
      Object.entries(TOPICS).map(([k,t])=>`<div class="topic-card" tabindex="0" data-topic="${k}"><span class="topic-chinese">${t.name}</span><span class="topic-english">${t.english}</span></div>`).join('')
    }</div>`;
    main.querySelectorAll('.topic-card').forEach(c=>{
      c.addEventListener('click',()=>{state.topic=c.dataset.topic;render();});
      c.addEventListener('keydown',e=>{if(e.key==='Enter'){state.topic=c.dataset.topic;render();}});
    });
    return;
  }
  const phrases=PHRASES.filter(p=>p.topic===state.topic&&p.dialects[state.dialect]);
  const t=TOPICS[state.topic];
  let html=`<button class="back-btn" id="back-topic">← Topics</button><h2 class="section-title">${t.name} ${t.english}</h2>`;
  html += ttsStatusHtml();
  if(!phrases.length){html+=`<p class="no-data">No phrases for this dialect yet. Try Sixian or Hailu.</p>`;}
  else{html+=phrases.map(p=>{
    const d=p.dialects[state.dialect];
    return`<div class="card">${playBtn(d.pfs)}<div class="card-text"><div class="characters">${p.characters}</div><div class="romanization">${rom(d)}</div><div class="english">${p.english}</div></div></div>`;
  }).join('');}
  main.innerHTML=html;
  $('#back-topic').addEventListener('click',()=>{state.topic=null;render();});
}

function renderDialogue(){
  if(!state.dialogueId){
    main.innerHTML=`<h2 class="section-title">Dialogues</h2><p class="section-desc">Step through conversations line by line. Tap the speaker icon to hear real Hakka pronunciation, then practice aloud.</p><div class="dialogue-grid">${
      DIALOGUES.map(d=>`<div class="dialogue-card" tabindex="0" data-id="${d.id}"><div class="d-title">${d.titleCh}</div><div class="d-subtitle">${d.title}</div></div>`).join('')
    }</div>`;
    main.querySelectorAll('.dialogue-card').forEach(c=>{
      c.addEventListener('click',()=>{state.dialogueId=c.dataset.id;state.revealedLines=1;render();});
    });
    return;
  }
  const dlg=DIALOGUES.find(d=>d.id===state.dialogueId);
  let html=`<button class="back-btn" id="back-dlg">← Dialogues</button><h2 class="section-title">${dlg.titleCh} — ${dlg.title}</h2>`;
  html+=`<div class="progress-bar">${dlg.lines.map((_,i)=>`<div class="progress-dot${i<state.revealedLines?' done':''}${i===state.revealedLines-1?' current':''}"></div>`).join('')}</div>`;
  dlg.lines.slice(0,state.revealedLines).forEach(line=>{
    const pfs=line.pfs[state.dialect]||Object.values(line.pfs)[0]||'';
    html+=`<div class="dialogue-line speaker-${line.speaker}"><span class="speaker-label">${line.speaker}</span><div class="line-content"><div class="characters">${line.chars}${playBtn(pfs,'play-inline')}</div><div class="romanization">${pfs}</div><div class="english">${line.eng}</div></div></div>`;
  });
  if(state.revealedLines<dlg.lines.length){
    html+=`<button class="btn" id="next-line" style="margin-top:0.75rem">Next line →</button>`;
  }else{
    html+=`<div style="margin-top:0.75rem;text-align:center"><p style="color:var(--jade);font-weight:600;margin-bottom:0.4rem">Dialogue complete</p><button class="btn" id="restart-dlg">Restart</button></div>`;
  }
  main.innerHTML=html;
  $('#back-dlg').addEventListener('click',()=>{state.dialogueId=null;render();});
  const nl=$('#next-line');if(nl)nl.addEventListener('click',()=>{state.revealedLines++;render();});
  const rd=$('#restart-dlg');if(rd)rd.addEventListener('click',()=>{state.revealedLines=1;render();});
}

function renderScenario(){
  const sc=SCENARIOS[state.scenarioIdx];
  let html=`<h2 class="section-title">Scenarios</h2><p class="score">Score: ${state.score} / ${state.completed}</p>`;
  html+=`<div class="scenario-prompt"><div class="characters">${sc.prompt.chars}</div><div class="english">${sc.prompt.eng}</div></div>`;
  html+=`<div class="choices">${sc.choices.map((c,i)=>{
    let cls='choice-btn';
    if(state.selected!==null){
      if(c.correct)cls+=' correct chosen';
      else if(i===state.selected)cls+=' incorrect chosen';
    }
    let inner=`<div class="choice-chars">${c.chars}</div><div class="choice-eng">${c.eng}</div>`;
    if(state.selected!==null&&c.correct&&c.pfs){
      const r=c.pfs[state.dialect]||Object.values(c.pfs)[0];
      inner+=`<div class="choice-rom">${r} ${playBtn(r,'play-inline')}</div>`;
    }
    return`<button class="${cls}" data-idx="${i}">${inner}</button>`;
  }).join('')}</div>`;
  if(state.selected!==null){
    html+=`<button class="btn" id="next-sc" style="margin-top:0.75rem">Next scenario →</button>`;
  }
  main.innerHTML=html;
  main.querySelectorAll('.choice-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      if(state.selected!==null)return;
      const idx=parseInt(btn.dataset.idx);
      state.selected=idx;
      state.completed++;
      if(sc.choices[idx].correct)state.score++;
      render();
    });
  });
  const ns=$('#next-sc');if(ns)ns.addEventListener('click',()=>{state.selected=null;state.scenarioIdx=(state.scenarioIdx+1)%SCENARIOS.length;render();});
}

function renderFreeform(){
  const available=PHRASES.filter(p=>p.dialects[state.dialect]);
  if(!available.length){main.innerHTML=`<p class="no-data">No phrases for this dialect.</p>`;return;}
  if(!state.freeformPhrase||!state.freeformPhrase.dialects[state.dialect]){
    state.freeformPhrase=available[Math.floor(Math.random()*available.length)];
    state.freeformFeedback=null;
  }
  const p=state.freeformPhrase;
  let html=`<h2 class="section-title">Free Form Practice</h2><p class="section-desc">Type the Hakka translation (characters or romanization) for the English prompt.</p>`;
  html+=`<div class="scenario-prompt"><div class="english" style="font-size:1.1rem;color:var(--text)">${p.english}</div></div>`;
  html+=`<form id="ff-form"><input type="text" class="freeform-input" id="ff-input" placeholder="Type in Hakka..." autocomplete="off"><button type="submit" class="btn">Check</button></form>`;
  if(state.freeformFeedback){
    const fb=state.freeformFeedback;
    const d=p.dialects[state.dialect];
    html+=`<div class="feedback"><p class="feedback-msg ${fb.ok?'ok':'wrong'}">${fb.msg}</p>`;
    if(fb.expected){
      html+=`<div style="margin-top:0.4rem;display:flex;align-items:center;gap:0.5rem">${playBtn(d.pfs,'play-inline')}<div><div class="characters">${p.characters}</div><div class="romanization">${rom(d)}</div></div></div>`;
    }
    html+=`<button class="btn" id="ff-next" style="margin-top:0.6rem">Next →</button></div>`;
  }
  main.innerHTML=html;
  const input=$('#ff-input');
  if(!state.freeformFeedback)input.focus();
  $('#ff-form').addEventListener('submit',e=>{
    e.preventDefault();
    const val=input.value.trim();if(!val)return;
    const target=p.dialects[state.dialect];
    const targetRom=target.pfs.replace(/[0-9]/g,'').toLowerCase();
    if(val===p.characters){state.freeformFeedback={ok:true,msg:'Perfect! Exact character match.'};}
    else if(val.toLowerCase()===target.pfs.toLowerCase()){state.freeformFeedback={ok:true,msg:'Perfect! Exact romanization match.'};}
    else if(val.replace(/[0-9]/g,'').toLowerCase()===targetRom){state.freeformFeedback={ok:true,msg:'Correct sounds! Watch the tones.'};}
    else{state.freeformFeedback={ok:false,msg:'Not quite. Here\'s the answer:',expected:true};}
    render();
  });
  const nx=$('#ff-next');if(nx)nx.addEventListener('click',()=>{
    state.freeformPhrase=available[Math.floor(Math.random()*available.length)];
    state.freeformFeedback=null;
    render();
  });
}

render();
</script>
</html>
