services:
  - type: web
    name: chord-transposer
    runtime: node
    plan: free
    # This repo keeps each project on its own branch, and the repo's default
    # branch is a different project — so the branch must be pinned explicitly.
    branch: claude/chord-transposer-app-xdm5df
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # Set these in the Render dashboard (Environment tab) — never commit secrets.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # API key for the Google Picker ("Browse Google Drive"). Optional —
      # without it the browse button is hidden and pasting a URL still works.
      - key: GOOGLE_API_KEY
        sync: false
      # Optional Cloud project number, used by Picker for drive.file access.
      - key: GOOGLE_PROJECT_NUMBER
        sync: false
      # Must match your Render URL, e.g. https://chord-transposer.onrender.com
      - key: BASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
